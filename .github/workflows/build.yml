name: Construire Odonavig (Windows et macOS)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur et la version portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Vérifier que Odonavig démarre sous Windows
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/win-unpacked/Odonavig.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Odonavig s'est fermé au démarrage (code $($p.ExitCode))" }
          $window = Get-Process -Id $p.Id | Select-Object -ExpandProperty MainWindowTitle
          Write-Host "Odonavig tourne (PID $($p.Id)), fenêtre : '$window'"
          Stop-Process -Id $p.Id -Force
          Get-Process Odonavig -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Publier les fichiers .exe
        uses: actions/upload-artifact@v4
        with:
          name: Odonavig-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Créer une version GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire les .dmg (Apple Silicon et Intel)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Vérifier la signature et le démarrage sur Mac
        run: |
          APP="dist/mac-arm64/Odonavig.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/Odonavig" > app.log 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 $PID 2>/dev/null; then
            echo "Odonavig s'est fermé au démarrage"; cat app.log; exit 1
          fi
          echo "Odonavig tourne sur macOS (PID $PID)"
          kill $PID || true

      - name: Publier les fichiers .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Odonavig-macOS
          path: |
            dist/*.dmg
            dist/*-mac-*.zip
          if-no-files-found: error

      - name: Ajouter à la version GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*-mac-*.zip
